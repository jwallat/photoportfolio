<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Portfolio</title>
    <link rel="stylesheet" href="/vendor/photoswipe/photoswipe.css" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: #111;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100%;
            overflow-x: hidden;
        }

        /* ── Header ── */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #111;
            border-bottom: 1px solid #222;
            padding: clamp(12px, 2vw, 20px) clamp(16px, 4vw, 48px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ddd;
        }

        /* ── Justified rows ──
           Each item gets flex-grow = its aspect ratio and a flex-basis of
           aspect ratio × target row height (set inline from JS). Rows then
           fill the full width while every photo in a row keeps the same height. */
        #gallery {
            --row-height: 130px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px;
        }

        /* Absorbs the free space in the last row, so it isn't stretched */
        #gallery::after {
            content: '';
            flex-grow: 1000000;
        }

        @media (min-width: 480px) {
            #gallery {
                --row-height: 180px;
                gap: 6px;
                padding: 6px;
            }
        }

        @media (min-width: 900px) {
            #gallery {
                --row-height: 240px;
                gap: 8px;
                padding: 8px;
            }
        }

        @media (min-width: 1400px) {
            #gallery {
                --row-height: 300px;
            }
        }

        /* ── Gallery items ── */
        .gallery-item {
            display: block;
            min-width: 0;
            overflow: hidden;
            border-radius: 3px;
            cursor: zoom-in;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            transition: opacity 0.2s ease, transform 0.3s ease;
            background: #1a1a1a;
        }

        .gallery-item img.loading {
            opacity: 0;
        }

        /* Only on devices with a real pointer; on touch screens :hover sticks after a tap */
        @media (hover: hover) {
            .gallery-item:hover img {
                opacity: 0.88;
                transform: scale(1.01);
            }
        }

        /* ── Empty / error states ── */
        #status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            font-size: 1rem;
            color: #555;
            letter-spacing: 0.05em;
        }

        /* ── PhotoSwipe overrides ── */
        .pswp {
            --pswp-bg: #0e0e0e;
        }

        /* ── Footer ── */
        footer {
            margin-top: 32px;
            padding: clamp(16px, 2vw, 24px) clamp(16px, 4vw, 48px);
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: #444;
        }

        footer a {
            color: #555;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.15s;
        }

        footer a:hover {
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>Photo Portfolio</h1>
    </header>

    <div id="status">Loading…</div>
    <div id="gallery" style="display:none" class="pswp-gallery"></div>

    <!-- PhotoSwipe v5 (ESM) -->
    <div class="pswp" tabindex="-1"></div>

    <footer>
        <a href="https://example.com/impressum" target="_blank" rel="noopener">Impressum</a>
        <a href="https://example.com/privacy" target="_blank" rel="noopener">Privacy Policy</a>
    </footer>

    <script type="module">
        import PhotoSwipeLightbox from '/vendor/photoswipe/photoswipe-lightbox.esm.min.js';

        const gallery = document.getElementById('gallery');
        const status = document.getElementById('status');

        async function init() {
            let images;
            try {
                const res = await fetch('/api/images');
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
                images = await res.json();
            } catch (err) {
                status.textContent = 'Could not load photos.';
                console.error(err);
                return;
            }

            if (!images.length) {
                status.textContent = 'No photos yet.';
                return;
            }

            // Build gallery items
            const fragment = document.createDocumentFragment();
            for (const { filename, width, height } of images) {
                const a = document.createElement('a');
                a.href = `/img/full/${encodeURIComponent(filename)}`;
                a.className = 'gallery-item';
                a.dataset.pswpWidth = width;
                a.dataset.pswpHeight = height;
                const aspect = width / height;
                a.style.flexGrow = aspect;
                a.style.flexBasis = `calc(${aspect} * var(--row-height))`;

                const img = document.createElement('img');
                img.src = `/img/grid/${encodeURIComponent(filename)}`;
                // Reserve the right space before loading, so lazy loading only
                // fetches the thumbnails that are actually near the viewport
                img.width = width;
                img.height = height;
                img.alt = filename.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
                img.loading = 'lazy';
                img.decoding = 'async';
                img.classList.add('loading');

                img.addEventListener('load', () => img.classList.remove('loading'), { once: true });
                img.addEventListener('error', () => img.style.minHeight = '0', { once: true });

                a.appendChild(img);
                fragment.appendChild(a);
            }

            gallery.appendChild(fragment);
            status.style.display = 'none';
            gallery.style.display = '';

            // Init PhotoSwipe lightbox
            const lightbox = new PhotoSwipeLightbox({
                gallery: '#gallery',
                children: 'a.gallery-item',
                pswpModule: () => import('/vendor/photoswipe/photoswipe.esm.min.js'),

                // Mobile-friendly options
                // Tap on the photo toggles the controls, tap on the empty area around it closes
                tapAction(point, event) {
                    if (event.target.classList.contains('pswp__img')) {
                        this.element.classList.toggle('pswp--ui-visible');
                    } else {
                        this.close();
                    }
                },
                doubleTapAction: 'zoom',
                wheelToZoom: true,
                padding: { top: 20, bottom: 20, left: 0, right: 0 },
                bgOpacity: 0.95,
            });

            lightbox.init();
        }

        init();
    </script>

</body>

</html>
