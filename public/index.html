<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{SITE_TITLE}}</title>
    <link rel="stylesheet" href="/vendor/photoswipe/photoswipe.css" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            background: #111;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100%;
            overflow-x: hidden;
        }

        /* ── Header ── */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #111;
            border-bottom: 1px solid #222;
            padding: clamp(12px, 2vw, 20px) clamp(16px, 4vw, 48px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ddd;
        }

        /* Breakpoints here must match columnCount() in the script below */

        /* ── Phones: justified rows ──
           Each item gets flex-grow = its aspect ratio and a flex-basis of
           aspect ratio × target row height. Rows then fill the full width
           while every photo in a row keeps the same height. */
        @media (max-width: 767px) {
            #gallery {
                --row-height: 130px;
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 4px;
            }

            /* Absorbs the free space in the last row, so it isn't stretched */
            #gallery::after {
                content: '';
                flex-grow: 1000000;
            }

            .gallery-item {
                min-width: 0;
                flex: var(--aspect) 1 calc(var(--aspect) * var(--row-height));
            }
        }

        @media (min-width: 480px) and (max-width: 767px) {
            #gallery {
                --row-height: 180px;
                gap: 6px;
                padding: 6px;
            }
        }

        /* ── Larger screens: masonry columns ──
           The script places each photo into the currently shortest column */
        @media (min-width: 768px) {
            #gallery {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 8px;
            }

            .gallery-column {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
        }

        /* ── Gallery items ── */
        .gallery-item {
            display: block;
            overflow: hidden;
            border-radius: 3px;
            cursor: zoom-in;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            transition: opacity 0.2s ease, transform 0.3s ease;
            background: #1a1a1a;
        }

        .gallery-item img.loading {
            opacity: 0;
        }

        /* Only on devices with a real pointer; on touch screens :hover sticks after a tap */
        @media (hover: hover) {
            .gallery-item:hover img {
                opacity: 0.88;
                transform: scale(1.01);
            }
        }

        /* ── Empty / error states ── */
        #status {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            font-size: 1rem;
            color: #555;
            letter-spacing: 0.05em;
        }

        /* ── PhotoSwipe overrides ── */
        .pswp {
            --pswp-bg: #0e0e0e;
        }

        /* ── Info text in the lightbox ── */
        .pswp__button--info {
            display: none;
        }

        .pswp--has-caption .pswp__button--info {
            display: block;
        }

        .pswp__info-caption {
            position: absolute;
            left: 0;
            right: 0;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 16px;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: center;
            white-space: pre-line;
            transition: opacity 0.2s ease;
        }

        /* Hidden copy used to measure how much room a text needs */
        .pswp__info-measure {
            top: 0;
            visibility: hidden;
        }

        /* Get out of the way while zoomed in, or when the controls are hidden */
        .pswp--zoomed-in .pswp__info-caption,
        .pswp:not(.pswp--ui-visible) .pswp__info-caption {
            opacity: 0;
        }

        /* ── Footer ── */
        footer {
            margin-top: 32px;
            padding: clamp(16px, 2vw, 24px) clamp(16px, 4vw, 48px);
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: #444;
        }

        footer a {
            color: #555;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.15s;
        }

        footer a:hover {
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>{{SITE_TITLE}}</h1>
    </header>

    <div id="status">Loading…</div>
    <div id="gallery" style="display:none" class="pswp-gallery"></div>

    <!-- PhotoSwipe v5 (ESM) -->
    <div class="pswp" tabindex="-1"></div>

    {{FOOTER}}

    <script type="module">
        import PhotoSwipeLightbox from '/vendor/photoswipe/photoswipe-lightbox.esm.min.js';

        const gallery = document.getElementById('gallery');
        const status = document.getElementById('status');

        // Gallery items in their original order, as { element, aspect, caption }
        const items = [];

        // Info text below the photo in the lightbox, toggled with the ⓘ button.
        // Stays on while swiping until it's toggled off again.
        const PADDING = 20;
        const CAPTION_GAP = 12;
        let infoVisible = false;
        let captionEl;
        let measureEl;

        // Room to reserve below a photo so its text fits without covering it
        function captionSpace(caption) {
            if (!infoVisible || !caption || !measureEl) return PADDING;
            measureEl.textContent = caption;
            return measureEl.offsetHeight + 2 * CAPTION_GAP;
        }

        function updateCaption(pswp) {
            const slide = pswp.currSlide;
            const caption = slide?.data.caption;
            pswp.element.classList.toggle('pswp--has-caption', Boolean(caption));
            captionEl.hidden = !(infoVisible && caption);
            if (captionEl.hidden) return;

            // Place the text right below the photo, which is centered in the
            // area above the reserved space
            const imageHeight = slide.height * slide.zoomLevels.initial;
            const imageBottom = PADDING + (slide.panAreaSize.y + imageHeight) / 2;
            captionEl.textContent = caption;
            captionEl.style.top = `${Math.round(imageBottom + CAPTION_GAP)}px`;
        }

        // 0 means justified rows (phones); must match the CSS breakpoints
        function columnCount() {
            if (matchMedia('(min-width: 1400px)').matches) return 4;
            if (matchMedia('(min-width: 900px)').matches) return 3;
            if (matchMedia('(min-width: 768px)').matches) return 2;
            return 0;
        }

        function layout() {
            const count = columnCount();
            if (count === 0) {
                gallery.replaceChildren(...items.map((item) => item.element));
                return;
            }

            // Put each photo into the currently shortest column. Heights are
            // computed from aspect ratios, so this works before images load.
            const columns = Array.from({ length: count }, () => {
                const column = document.createElement('div');
                column.className = 'gallery-column';
                return column;
            });
            const heights = new Array(count).fill(0);
            for (const { element, aspect } of items) {
                const shortest = heights.indexOf(Math.min(...heights));
                columns[shortest].appendChild(element);
                heights[shortest] += 1 / aspect + 0.02; // + roughly the gap between photos
            }
            gallery.replaceChildren(...columns);
        }

        for (const query of ['(min-width: 768px)', '(min-width: 900px)', '(min-width: 1400px)']) {
            matchMedia(query).addEventListener('change', layout);
        }

        async function init() {
            let images;
            try {
                const res = await fetch('/api/images');
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
                images = await res.json();
            } catch (err) {
                status.textContent = 'Could not load photos.';
                console.error(err);
                return;
            }

            if (!images.length) {
                status.textContent = 'No photos yet.';
                return;
            }

            // Build gallery items
            for (const { filename, width, height, caption } of images) {
                const a = document.createElement('a');
                a.href = `/img/full/${encodeURIComponent(filename)}`;
                a.className = 'gallery-item';
                a.dataset.pswpWidth = width;
                a.dataset.pswpHeight = height;
                const aspect = width / height;
                a.style.setProperty('--aspect', aspect);

                const img = document.createElement('img');
                img.src = `/img/grid/${encodeURIComponent(filename)}`;
                // Reserve the right space before loading, so lazy loading only
                // fetches the thumbnails that are actually near the viewport
                img.width = width;
                img.height = height;
                img.alt = filename.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
                img.loading = 'lazy';
                img.decoding = 'async';
                img.classList.add('loading');

                img.addEventListener('load', () => img.classList.remove('loading'), { once: true });
                img.addEventListener('error', () => img.style.minHeight = '0', { once: true });

                a.appendChild(img);
                items.push({ element: a, aspect, caption });
            }

            layout();
            status.style.display = 'none';
            gallery.style.display = '';

            // Init PhotoSwipe lightbox
            const lightbox = new PhotoSwipeLightbox({
                gallery: '#gallery',
                // Pass the elements in original order; in column layout the
                // DOM order is column by column, which isn't the visual order
                children: items.map((item) => item.element),
                pswpModule: () => import('/vendor/photoswipe/photoswipe.esm.min.js'),

                // Mobile-friendly options
                // Tap on the photo toggles the controls, tap on the empty area around it closes
                tapAction(point, event) {
                    if (event.target.classList.contains('pswp__img')) {
                        this.element.classList.toggle('pswp--ui-visible');
                    } else {
                        this.close();
                    }
                },
                doubleTapAction: 'zoom',
                wheelToZoom: true,
                paddingFn: (viewportSize, itemData) => ({
                    top: PADDING,
                    bottom: captionSpace(itemData.caption),
                    left: 0,
                    right: 0,
                }),
                bgOpacity: 0.95,
                // The info button takes the zoom button's place; zooming still
                // works with double-tap, pinch and the mouse wheel
                zoom: false,
            });

            lightbox.addFilter('itemData', (itemData, index) => {
                itemData.caption = items[index].caption;
                return itemData;
            });

            lightbox.on('uiRegister', () => {
                const { pswp } = lightbox;

                pswp.ui.registerElement({
                    name: 'info',
                    title: 'Info',
                    order: 10,
                    isButton: true,
                    html: {
                        isCustomSVG: true,
                        inner: '<path fill-rule="evenodd" id="pswp__icn-info" d="M16 6a10 10 0 1 0 0 20 10 10 0 1 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 1 1 0-16zm-1 3h2v2h-2zm0 3.5h2V21h-2z"/>',
                        outlineID: 'pswp__icn-info',
                    },
                    onInit: (el) => el.setAttribute('aria-pressed', infoVisible),
                    onClick: (event, el) => {
                        infoVisible = !infoVisible;
                        el.setAttribute('aria-pressed', infoVisible);
                        // Recalculates the padding, which fires 'resize' and repositions the text
                        pswp.updateSize(true);
                    },
                });

                pswp.ui.registerElement({
                    name: 'info-caption',
                    appendTo: 'wrapper',
                    onInit: (el) => {
                        captionEl = el;
                        el.hidden = true;
                    },
                });

                pswp.ui.registerElement({
                    name: 'info-measure',
                    className: 'pswp__info-caption pswp__info-measure',
                    appendTo: 'wrapper',
                    onInit: (el) => {
                        measureEl = el;
                        el.setAttribute('aria-hidden', 'true');
                    },
                });

                pswp.on('change', () => updateCaption(pswp));
                pswp.on('resize', () => updateCaption(pswp));
            });

            lightbox.init();
        }

        init();
    </script>

</body>

</html>
