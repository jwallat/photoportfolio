services:
  photoportfolio:
    image: ghcr.io/jwallat/photoportfolio:latest
    container_name: photoportfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${PHOTOS_PATH}:/photos:ro
      - cache:/cache
    environment:
      - PHOTOS_DIR=/photos
      - PORT=3000
      - SITE_TITLE=Photo Portfolio
      - IMPRESSUM_URL=https://example.com/impressum
      - PRIVACY_URL=https://example.com/privacy

volumes:
  cache:
